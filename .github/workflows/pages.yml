name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.165.0
    steps:
      - uses: actions/checkout@v6
        with: { submodules: recursive, fetch-depth: 0 }
      - name: Install Hugo
        run: |
          curl -sSL -o hugo.deb \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          sudo dpkg -i hugo.deb
      - uses: actions/configure-pages@v5
        id: pages
      - uses: actions/setup-go@v5
        with: { go-version: 'stable' }
      - name: Update mounted documentation to each repository's main
        # `hugo mod get <repo>@main` resolves to a PSEUDO-VERSION pinned at the
        # commit main pointed at when it ran -- it is not a floating reference.
        # Without this step the site would keep serving the documentation of
        # whichever commit was current when go.mod was last written, and a doc fix
        # upstream would never appear. Running it on every deploy is what makes
        # "the site follows main" actually true.
        run: hugo mod get -u ./...
      - name: Build
        run: hugo --minify --baseURL "${{ steps.pages.outputs.base_url }}/"
      - uses: actions/upload-pages-artifact@v4
        with: { path: ./public }

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
