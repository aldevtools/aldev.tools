baseURL = 'https://aldev.tools/'
locale = 'en-us'
title = 'aldev.tools'
enableRobotsTXT = true

[params]
  description = 'Open source tooling for Business Central and AL developers.'
  # Set to false until Torben confirms; the People section renders only when true.
  showPeople = true

# The site has no taxonomies; without this Hugo emits empty tag/category pages
# and warns about a missing taxonomy template.
[taxonomies]

[markup.goldmark.renderer]
  unsafe = true

# --- Documentation mounted from the tool repositories -------------------------
#
# Each repository publishes a docs/manual/ written for readers. docs/ itself is a
# maintainer surface -- loud-failures.md pushes derivation prose out of code
# comments and into it -- so only manual/ is mounted, and the whole directory is
# taken rather than an allowlist: everything in it is public by construction.
#
# Ordering and titles come from each page's own front matter, so the source
# repository decides how its documentation reads and this site does not carry a
# second copy of that decision.
#
# This tracks main rather than the newest tag. Modules default to the newest TAG,
# which would be right for reference tied to a specific build and is wrong for a
# manual: it would mean the section stays empty until a release contains it, and a
# typo fix waiting on a release cycle. If version-pinned documentation is wanted
# later, Hugo can mount several versions side by side.
#
# Preview an unreleased branch without editing this file:
#   HUGO_MODULE_REPLACEMENTS="github.com/StefanMaron/BusinessCentral.AL.Runner -> /path/to/checkout" hugo server
[module]
  [[module.imports]]
    path = "github.com/StefanMaron/BusinessCentral.AL.Runner"
    [[module.imports.mounts]]
      source = "docs/manual"
      target = "content/al-runner"
