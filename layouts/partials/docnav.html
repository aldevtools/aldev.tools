{{- $cur := .RelPermalink -}}
{{- $section := site.GetPage "/al-runner" -}}
<nav class="docnav" aria-label="Documentation">
  <a class="home" href="/">&larr; aldev.tools</a>
  {{- with $section }}
  <p class="navsec">{{ .Title }}</p>
  <ul>
    {{- range .Pages.ByWeight }}
    <li><a href="{{ .RelPermalink }}"{{ if eq .RelPermalink $cur }} aria-current="page"{{ end }}>{{ .Title }}</a></li>
    {{- end }}
  </ul>
  {{- end }}
</nav>
