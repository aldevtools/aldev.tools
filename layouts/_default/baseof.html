<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ .Site.Title }}{{ with .Params.tagline }} — {{ . }}{{ end }}</title>
<meta name="description" content="{{ .Site.Params.description }}">
<meta property="og:title" content="{{ .Site.Title }}">
<meta property="og:description" content="{{ .Site.Params.description }}">
<meta property="og:type" content="website">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=JetBrains+Mono:wght@400;500&family=Public+Sans:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#0b0d10; --panel:#12161b; --ink:#eef1f4; --muted:#98a3af;
  --rule:#232a32; --rule-soft:#1a2027;
  --accent:#ff6a1f; --accent-ink:#ffb489; --accent-soft:#2a1508;
  --sans:"Public Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --disp:"Bricolage Grotesque",var(--sans);
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:light){
  :root:not([data-theme="dark"]){
    --bg:#fbfbfc; --panel:#ffffff; --ink:#11151a; --muted:#5d6874;
    --rule:#e3e7ec; --rule-soft:#eef1f4;
    --accent:#c8430b; --accent-ink:#a63808; --accent-soft:#fdefe7;
  }
}
:root[data-theme="light"]{
  --bg:#fbfbfc; --panel:#ffffff; --ink:#11151a; --muted:#5d6874;
  --rule:#e3e7ec; --rule-soft:#eef1f4;
  --accent:#c8430b; --accent-ink:#a63808; --accent-soft:#fdefe7;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);
     font-size:17px;line-height:1.6;-webkit-font-smoothing:antialiased}
.wrap{max-width:1000px;margin:0 auto;padding:0 24px}
a{color:var(--accent-ink);text-decoration:none}
a:hover{text-decoration:underline}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:3px}
h1,h2,h3{font-family:var(--disp);line-height:1.1;text-wrap:balance;margin:0}
.mono{font-family:var(--mono)}
footer{border-top:1px solid var(--rule);margin-top:88px}
footer .wrap{padding-top:28px;padding-bottom:56px;color:var(--muted);font-size:.9rem;
  display:flex;flex-wrap:wrap;gap:8px 24px;justify-content:space-between}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
{{ block "style" . }}{{ end }}
</style>
</head>
<body>
{{ block "main" . }}{{ end }}
<footer><div class="wrap">
  <span>Open source. MIT unless a repository says otherwise.</span>
  <span><a href="https://github.com/aldevtools">github.com/aldevtools</a></span>
</div></footer>
</body>
</html>
