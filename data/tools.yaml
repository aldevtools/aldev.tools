# Each group renders as a section on the home page.
#
# `repo` is the FULL owner/name path and is the single thing to change when a
# tool migrates into the organization: StefanMaron/X becomes aldevtools/X, one
# line, no template edit. Until then the link points where the code actually is,
# so every card on the page works today.
#
# `owner` is bookkeeping and is never rendered. It marks which groups are
# contingent on Torben joining -- delete a group and the page still renders.

- group: Running and testing
  blurb: Business Central behaviour, executed and checked without the usual host.
  owner: stefan
  items:
    - name: AL Runner
      repo: StefanMaron/BusinessCentral.AL.Runner
      # `docs` is the content section mounted from this repository. Set it only
      # once the mount exists in hugo.toml -- the card renders a Documentation
      # link when it is present and stays source-only when it is not.
      docs: al-runner
      text: Run Business Central AL unit tests in milliseconds. No service tier, no Docker, no SQL Server, no license.
    - name: AL Language Tests
      repo: StefanMaron/BusinessCentral.AL.Language.Tests
      text: An executable specification of AL, checked against a real Business Central service tier on every push.
    - name: BC on Linux
      repo: StefanMaron/MsDyn365Bc.On.Linux
      text: Business Central running on Linux with Docker Compose.
    - name: DbReader
      repo: StefanMaron/BusinessCentral.DbReader
      text: Read Business Central data from a SQL Server backup or a cloud export, without SQL Server.

- group: Language and analysis
  blurb: Reading AL as a language rather than as text.
  owner: torben
  items:
    - name: tree-sitter-al
      repo: SShadowS/tree-sitter-al
      text: A Tree-sitter parser for AL.
    - name: al-sem
      repo: SShadowS/al-sem
      text: Whole-program semantic analysis for AL.
    - name: LethAL
      repo: SShadowS/LethAL
      text: Mutation testing for AL — checks whether your tests would catch a change.
    - name: al-perf
      repo: SShadowS/al-perf
      text: Analyze .alcpuprofile files, find hotspots, and render flamegraphs.

- group: Editors and agents
  blurb: Putting AL in front of the tools people actually work in.
  owner: torben
  items:
    - name: ALchemist
      repo: SShadowS/ALchemist
      text: Live execution and inline feedback for AL, in the editor.
    - name: al-lsp-for-agents
      repo: SShadowS/al-lsp-for-agents
      text: An AL language server built for coding agents.
    - name: business-central-mcp
      repo: SShadowS/business-central-mcp
      text: An MCP server for Business Central.
